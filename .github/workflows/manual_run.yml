name: Run Gemini Models Check

# הפקודה הזו מייצרת את כפתור ההרצה הידנית בממשק של גיטהאב
on:
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # עודכן לגרסה 3.11 בהתאם לדרישות החדשות של גוגל
          python-version: '3.11'
          
      - name: Install dependencies
        # קורא לקובץ ה-requirements כדי להתקין ספריות
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Models Script
        # כאן אנחנו מושכים את "הסוד" מהכספת של גיטהאב ומעבירים אותו לקוד
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_available_models.py

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-report
          path: |
            models_report.json
            models_report.md
