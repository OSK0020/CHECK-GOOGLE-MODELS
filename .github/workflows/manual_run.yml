name: Run Gemini Models Check

# הפקודה הזו מייצרת את כפתור ההרצה הידנית בממשק של גיטהאב
on:
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # קורא לקובץ ה-requirements כדי להתקין ספריות
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Models Script
        # כאן אנחנו מושכים את "הסוד" מהכספת של גיטהאב ומעבירים אותו לקוד
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python get_available_models.py
