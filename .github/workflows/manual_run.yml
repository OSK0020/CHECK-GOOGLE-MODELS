name: Run Gemini Models Check

# Enables manual execution with optional custom API Key input or secret fallback
on:
  workflow_dispatch:
    inputs:
      api_key:
        description: 'Optional: Custom Gemini API Key (leave empty to use repository secret GEMINI_API_KEY)'
        required: false
        type: string
        default: ''

jobs:
  check-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Securely Mask Input API Key
        run: |
          KEY="${{ inputs.api_key }}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
          fi
          
      - name: Run Models Check Script
        env:
          GEMINI_API_KEY: ${{ inputs.api_key != '' && inputs.api_key || secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python get_available_models.py

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: models-report
          path: |
            models_report.json
            models_report.md
